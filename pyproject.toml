[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismind-ai-hunter"
version = "0.2.0"
description = "Evidence-first, scope-bound web security assessment CLI"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0,<3", "python-dotenv>=1.0.1,<2"]

[tool.setuptools.packages.find]
include = ["aegismind*"]
